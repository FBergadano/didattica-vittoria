<script>
// ── Citazioni <cit autore="..."> ─────────────────────────────
(function() {
  document.querySelectorAll('cit[autore]').forEach(function(el) {
    var author = el.getAttribute('autore');
    while (el.firstChild && el.firstChild.nodeType === 3 && !el.firstChild.textContent.trim()) {
      el.removeChild(el.firstChild);
    }
    if (el.firstChild && el.firstChild.nodeType === 3) {
      el.firstChild.textContent = el.firstChild.textContent.replace(/^\s+/, '');
    }
    while (el.lastChild && el.lastChild.nodeType === 3 && !el.lastChild.textContent.trim()) {
      el.removeChild(el.lastChild);
    }
    if (el.lastChild && el.lastChild.nodeType === 3) {
      el.lastChild.textContent = el.lastChild.textContent.replace(/\s+$/, '');
    }
    el.insertBefore(document.createTextNode('« '), el.firstChild);
    el.appendChild(document.createTextNode(' »'));
    var aut = document.createElement('span');
    aut.className = 'cit-aut';
    aut.textContent = '— ' + author;
    el.appendChild(aut);
  });
})();

// ── Numerazione degli esercizi della teoria ───────────────────────────
// Ogni esercizio della teoria riceve un numero, qualunque sia il suo nome
// ("Verifica Subito!", "Prova tu!", "Isola le altre grandezze", "Trova
// l'unità di misura", un completamento, una scheda Frayer…): una sola serie
// per capitolo, nell'ordine della pagina. Il numero compare in un cerchietto
// accanto all'etichetta (o all'inizio del widget, se non ha etichetta), il
// riquadro riceve l'ancora #es-N e l'attributo data-es (usato dalle consegne
// e dai compiti "esercizi: [3, 5]").
// Restano senza numero: i riquadri d'esempio già risolti (niente a cui
// rispondere), le simulazioni/laboratori e gli esercizi di riepilogo (ex.html,
// che hanno la loro numerazione).
(function() {
  var prose = document.querySelector('.chapter-prose');
  if (!prose) return;
  // ciò a cui si risponde (gli slider delle simulazioni non contano)
  var RISPOSTA = 'input:not([type=range]), select, textarea, .tf-btn, .iex-choice-btn, .qgf-btn-si, .match-widget, .sort-widget, .order-widget';
  // widget che sono esercizi anche senza un riquadro intorno
  var SCIOLTI = '.uderive-widget, .invx-widget, .ubx-widget, .frayer, .fillm-wrap, .fill-wrap, .sci-wrap, .sciex-widget, .tplcz-widget, ' +
                '.match-widget, .sort-widget, .order-widget, .qgf-widget, .tf-item, .iex-choices, .raperta, .riflessione';
  var CAND = '.iex-widget, .box.box-ex, .iex-lbl, ' + SCIOLTI;
  var n = 0;
  // un'etichetta scritta direttamente nel testo (senza un riquadro tutto suo):
  // raccolgo lei e ciò che la segue, fino al prossimo titolo o esercizio
  function fine(x) { return /^H[1-6]$/.test(x.tagName) || x.matches('.box, .iex-widget, .iex-lbl') || !!x.querySelector('.iex-widget, .iex-lbl, .box'); }
  function raggruppa(lbl) {
    var w = document.createElement('div'), x = lbl;
    w.className = 'es-gruppo';
    lbl.parentNode.insertBefore(w, lbl);
    while (x) {
      var dopo = x.nextSibling;
      w.appendChild(x);
      x = dopo;
      if (x && x.nodeType === 1 && fine(x)) break;
    }
    return w;
  }
  [].slice.call(prose.querySelectorAll(CAND)).forEach(function(el) {
    if (el.closest('[data-es], .ex-box')) return; // già dentro un esercizio numerato, o esercizio di riepilogo
    var box = el, lbl = null;
    if (el.matches('.iex-lbl')) { box = raggruppa(el); lbl = el; }
    else if (el.matches('.box.box-ex')) {
      lbl = el.querySelector(':scope > .box-label');
      var titolo = /^\s*(Esercizio|Verifica Subito|Prova tu)\b/i.test(lbl ? lbl.textContent : '');
      if (!titolo && !el.querySelector(RISPOSTA + ', ' + SCIOLTI)) return; // un esempio già risolto
    }
    else if (el.matches('.iex-widget')) lbl = el.querySelector('.iex-lbl');
    else lbl = el.querySelector(':scope > [class*="-lbl"], :scope > [class*="title"], :scope > [class*="titolo"]');
    n++;
    box.dataset.es = n;
    if (!box.id) box.id = 'es-' + n;
    var b = document.createElement('span');
    b.className = 'es-num'; b.textContent = n; b.title = 'Esercizio ' + n;
    if (lbl) {
      // "Esercizio 3 — Titolo": il numero scritto a mano lascia il posto a quello nel cerchietto
      var t = lbl.firstChild;
      if (t && t.nodeType === 3 && /^\s*Esercizio\b/i.test(t.data)) {
        var resto = t.data.replace(/^\s*Esercizio[\s ]*\d*[\s ]*(?:[—–-][\s ]*)?/i, '');
        t.data = resto ? 'Esercizio — ' + resto : 'Esercizio';
      }
      lbl.insertBefore(b, lbl.firstChild);
    } else box.insertBefore(b, box.firstChild);
  });
})();

// ── Numerazione automatica delle figure (come \ref in LaTeX) ──────────
(function() {
  var map = {};
  document.querySelectorAll('.fig-num[data-fig-id]').forEach(function(el, i) {
    var n = i + 1;
    map[el.getAttribute('data-fig-id')] = n;
    el.textContent = 'Figura ' + n;
  });
  document.querySelectorAll('.fig-ref[data-fig-ref]').forEach(function(el) {
    var n = map[el.getAttribute('data-fig-ref')];
    if (n) el.textContent = 'Figura ' + n;
  });
})();

// ── PDF export with QR codes for videos ───────────────────────
function exportPDF() {
  var wraps = document.querySelectorAll('.video-wrap');
  var inserted = [];

  wraps.forEach(function(wrap) {
    var iframe = wrap.querySelector('iframe');
    if (!iframe) return;
    var m = iframe.src.match(/\/embed\/([^?&]+)/);
    if (!m) return;
    var vid = m[1];
    var ytUrl = 'https://www.youtube.com/watch?v=' + vid;
    var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(ytUrl);
    var cap = iframe.title || '';

    var div = document.createElement('div');
    div.className = 'video-qr-print';
    div.innerHTML =
      '<img src="' + qrUrl + '" width="200" height="200" alt="QR code video">' +
      (cap ? '<p class="video-caption">' + cap + '</p>' : '') +
      '<p class="video-qr-url">' + ytUrl + '</p>';
    wrap.parentNode.insertBefore(div, wrap.nextSibling);
    inserted.push(div);
  });

  // video esterni (video-link.html): stesso QR, con l'indirizzo della pagina
  document.querySelectorAll('.video-link[data-url]').forEach(function(a) {
    var url = a.getAttribute('data-url');
    var div = document.createElement('div');
    div.className = 'video-qr-print';
    div.innerHTML =
      '<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(url) + '" width="200" height="200" alt="QR code video">' +
      '<p class="video-caption">' + (a.getAttribute('data-titolo') || '') + '</p>' +
      '<p class="video-qr-url">' + url + '</p>';
    a.parentNode.insertBefore(div, a.nextSibling);
    inserted.push(div);
  });

  window.addEventListener('afterprint', function cleanup() {
    inserted.forEach(function(d) { d.remove(); });
    window.removeEventListener('afterprint', cleanup);
  });

  window.print();
}

// ── Font accessibility toggle ──────────────────────────────────
function toggleFont() {
  const body = document.body;
  const btn  = document.getElementById('font-toggle');
  const active = body.classList.toggle('accessible-font');
  btn.setAttribute('aria-pressed', active.toString());
  btn.textContent = active ? 'Aa  standard' : 'Aa\u2009 leggibilità';
  localStorage.setItem('lv-font', active ? '1' : '');
}
(function() {
  if (localStorage.getItem('lv-font')) {
    document.body.classList.add('accessible-font');
    const btn = document.getElementById('font-toggle');
    if (btn) { btn.setAttribute('aria-pressed','true'); btn.textContent = 'Aa  standard'; }
  }
})();

// ── Reading progress bar ───────────────────────────────────────
(function() {
  var bar = document.getElementById('read-progress');
  var pct = document.getElementById('read-progress-pct');
  if (!bar) return;
  function update() {
    var doc = document.documentElement;
    var scrolled = doc.scrollTop || document.body.scrollTop;
    var total = doc.scrollHeight - doc.clientHeight;
    var p = total > 0 ? (scrolled / total * 100) : 0;
    bar.style.width = p + '%';
    if (pct) pct.textContent = Math.round(p) + '%';
  }
  window.addEventListener('scroll', update, { passive: true });
  update();
})();

// ── Evita che la punteggiatura subito dopo una formula inline (es. "$F=ma$,")
//    venga orfanizzata sulla riga successiva. Inserisce un WORD JOINER (U+2060,
//    invisibile) fra la formula e la punteggiatura: dice al motore di line-breaking
//    "non spezzare qui", senza toccare white-space (quindi le formule lunghe
//    possono ancora andare a capo internamente quando serve). Un MutationObserver
//    copre sia il primo typeset di MathJax sia i re-typeset dinamici dei widget.
(function() {
  var PUNCT = /^[,.;:!?)\]]/;
  function fix(mjx) {
    if (mjx.getAttribute('display') === 'true') return;
    if (mjx._punctFixed) return;
    var next = mjx.nextSibling;
    if (next && next.nodeType === 3 && PUNCT.test(next.textContent)) {
      mjx._punctFixed = true;
      mjx.parentNode.insertBefore(document.createTextNode('\u2060'), next);
    }
  }
  document.querySelectorAll('mjx-container').forEach(fix);
  new MutationObserver(function(muts) {
    muts.forEach(function(m) {
      m.addedNodes.forEach(function(n) {
        if (n.nodeType !== 1) return;
        if (n.tagName === 'MJX-CONTAINER') fix(n);
        else if (n.querySelectorAll) n.querySelectorAll('mjx-container').forEach(fix);
      });
    });
  }).observe(document.body, { childList: true, subtree: true });
})();

// ── Sidebar TOC: costruisce l'indice e segna la sezione attiva ─
(function() {
  var toc   = document.getElementById('sidebar-toc');
  var prose = document.querySelector('.chapter-prose');
  if (!toc || !prose) return;

  var headings = prose.querySelectorAll('h1, h2');
  if (!headings.length) return;

  var items = [];
  var h1count = 0;
  headings.forEach(function(h) {
    if (!h.id) {
      h.id = 'sec-' + h.textContent.trim().toLowerCase()
        .replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').slice(0, 40);
    }
    var li = document.createElement('li');
    if (h.tagName === 'H2') {
      li.className = 'toc-h2';
    } else {
      h1count++;
    }
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = (h.tagName === 'H1' ? h1count + '. ' : '') + h.textContent;
    li.appendChild(a);
    toc.appendChild(li);
    items.push({ el: h, link: a });
  });

  var OFFSET = 80;
  function updateActive() {
    var scrollY = window.scrollY + OFFSET;
    var current = null;
    items.forEach(function(item) {
      if (item.el.getBoundingClientRect().top + window.scrollY <= scrollY) current = item;
    });
    items.forEach(function(item) { item.link.classList.remove('active'); });
    if (current) current.link.classList.add('active');
  }
  window.addEventListener('scroll', updateActive, { passive: true });
  updateActive();
})();

// ── Formule inline più larghe della riga: diventano scorrevoli ───────
// (le formule in display scorrono già via CSS; quelle inline solo se
// davvero non ci stanno, per non toccare l'allineamento delle altre)
(function() {
  var prose = document.querySelector('.chapter-prose');
  if (!prose) return;
  function blockOf(el) {
    var a = el.parentElement;
    while (a && a !== prose && getComputedStyle(a).display.indexOf('inline') === 0) a = a.parentElement;
    return a || prose;
  }
  function check() {
    prose.querySelectorAll('mjx-container:not([display="true"])').forEach(function(m) {
      m.classList.remove('mjx-wide');
      var b = blockOf(m);
      if (m.getBoundingClientRect().right > b.getBoundingClientRect().right + 1) m.classList.add('mjx-wide');
    });
  }
  var t = null;
  function later() { clearTimeout(t); t = setTimeout(check, 200); }
  var tries = 0;
  (function wait() {
    var mj = window.MathJax;
    if (mj && mj.startup && mj.startup.promise) { mj.startup.promise.then(check); return; }
    if (++tries < 60) setTimeout(wait, 100);
  })();
  window.addEventListener('resize', later);
  document.addEventListener('toggle', later, true); // spoiler e soluzioni aperti
  document.addEventListener('click', later, true);  // slide dei caroselli, schede: formule prima nascoste
})();

// ── Stampa: carica subito le immagini "pigre" non ancora arrivate ────
// (altrimenti nel PDF mancherebbero le figure più in basso nella pagina)
window.addEventListener('beforeprint', function() {
  document.querySelectorAll('img[loading="lazy"]').forEach(function(img) { img.loading = 'eager'; });
});
// ── Fuochi d'artificio per un esercizio della teoria fatto tutto giusto ──
// Ogni parte di un esercizio numerato (data-es) che ha una risposta giusta o
// sbagliata (domanda a scelta multipla, vero/falso, completamento, isola,
// unità di misura, trascina…) comunica il suo esito con _lvSave/_lvEsito o
// con l'evento iex:correct. Qui si ricorda, per ciascuna parte, il primo esito
// e l'ultimo (in questa visita della pagina): quando tutte le parti
// dell'esercizio sono giuste, e giuste al primo colpo, partono i fuochi.
// Le risposte rimesse a posto all'apertura della pagina non contano.
(function() {
  var UNIT = '.qgf-widget, .iex-choices, .fillm-wrap, .fill-wrap, .tf-item, .invx-widget, .uderive-widget, .sort-widget, .match-widget, .vdrag-widget';
  var last = null, lastT = 0, rec = new WeakMap(), lastFire = 0;
  ['pointerdown', 'keydown', 'input', 'change', 'click'].forEach(function(t) {
    document.addEventListener(t, function(e) { if (e.isTrusted && e.target && e.target.nodeType === 1) { last = e.target; lastT = Date.now(); } }, true);
  });
  function esitoDi(ns, d) {
    if (!d || typeof d !== 'object') return null;
    if (typeof d.right === 'boolean') return d.right ? 1 : 0;
    if (typeof d.found === 'boolean') return d.found ? 1 : 0;
    if (typeof d.ok === 'boolean') return d.ok ? 1 : 0;
    if (Array.isArray(d.ok) && d.ok.length) return d.ok.filter(Boolean).length / d.ok.length;
    if (ns === 'quiz' && Array.isArray(d.results) && d.results.length) return d.results.filter(Boolean).length / d.results.length;
    if (ns === 'uderive') return 1;
    return null;
  }
  // fuochi d'artificio (condivisi: anche il quiz vero/falso li usa), mai due volte di fila
  window._lvFuochi = function() {
    if (Date.now() - lastFire < 2500) return; lastFire = Date.now();
    var canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
    canvas.width = window.innerWidth; canvas.height = window.innerHeight; document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d'), cols = ['#fbbf24', '#ef4444', '#0891b2', '#22d3ee', '#10b981', '#f472b6', '#fff', '#fde68a'];
    var bursts = [], cnt = 0, max = 7;
    function burst() {
      var cx = innerWidth * (.15 + Math.random() * .7), cy = innerHeight * (.08 + Math.random() * .5), col = cols[Math.floor(Math.random() * cols.length)], ps = [];
      for (var k = 0; k < 110; k++) { var a = Math.random() * Math.PI * 2, sp = Math.random() * 7 + 2; ps.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: Math.random() * 3 + 1, col: col, a: 1 }); }
      bursts.push(ps);
    }
    burst();
    var t = setInterval(function() { cnt++; if (cnt < max) burst(); else clearInterval(t); }, 300);
    (function frame() {
      ctx.fillStyle = 'rgba(0,0,0,0.13)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      var alive = false;
      bursts.forEach(function(ps) { ps.forEach(function(p) {
        p.x += p.vx; p.y += p.vy; p.vy += .07; p.a -= .017; if (p.a <= 0) return; alive = true;
        ctx.beginPath(); ctx.globalAlpha = p.a; ctx.fillStyle = p.col; ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }); });
      ctx.globalAlpha = 1;
      if (alive || cnt < max) requestAnimationFrame(frame); else canvas.remove();
    })();
  };
  function segna(unit, ok) {
    if (!unit || ok === null || ok === undefined) return;
    var r = rec.get(unit); if (!r) { r = { first: ok }; rec.set(unit, r); } r.last = ok;
    var box = unit.closest('[data-es]'); if (!box || box.dataset.fuochi) return;
    var units = [].slice.call(box.querySelectorAll(UNIT)).filter(function(u) { return !u.parentElement.closest(UNIT); });
    var tutte = units.length && units.every(function(u) { var x = rec.get(u); return x && x.first === 1 && x.last === 1; });
    if (tutte) { box.dataset.fuochi = '1'; setTimeout(window._lvFuochi, 600); }
  }
  function unitaDi(el) { return el && el.closest ? el.closest(UNIT) : null; }
  function dalVivo() { return Date.now() - lastT < 6000; }
  var origSave = window._lvSave, origEsito = window._lvEsito;
  if (origSave) window._lvSave = function(ns, id, data) {
    var r = origSave.apply(this, arguments);
    try { if (dalVivo()) segna(unitaDi(last), esitoDi(ns, data)); } catch (e) {}
    return r;
  };
  window._lvEsito = function(ns, id, giusto) {
    if (origEsito) origEsito.apply(this, arguments);
    try { if (dalVivo()) segna(unitaDi(last), giusto ? 1 : 0); } catch (e) {}
  };
  document.addEventListener('iex:correct', function(e) {
    if (!dalVivo()) return;
    var u = unitaDi(e.target) || (e.target.querySelector && e.target.querySelector(UNIT));
    if (u) segna(u, 1);
  });
})();
</script>

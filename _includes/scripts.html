<script src="{{ '/assets/js/qrcode.min.js' | relative_url }}"></script>
<script>
// ── Citazioni <cit autore="..."> ─────────────────────────────
(function() {
  document.querySelectorAll('cit[autore]').forEach(function(el) {
    var author = el.getAttribute('autore');
    while (el.firstChild && el.firstChild.nodeType === 3 && !el.firstChild.textContent.trim()) {
      el.removeChild(el.firstChild);
    }
    if (el.firstChild && el.firstChild.nodeType === 3) {
      el.firstChild.textContent = el.firstChild.textContent.replace(/^\s+/, '');
    }
    while (el.lastChild && el.lastChild.nodeType === 3 && !el.lastChild.textContent.trim()) {
      el.removeChild(el.lastChild);
    }
    if (el.lastChild && el.lastChild.nodeType === 3) {
      el.lastChild.textContent = el.lastChild.textContent.replace(/\s+$/, '');
    }
    el.insertBefore(document.createTextNode('« '), el.firstChild);
    el.appendChild(document.createTextNode(' »'));
    var aut = document.createElement('span');
    aut.className = 'cit-aut';
    aut.textContent = '— ' + author;
    el.appendChild(aut);
  });
})();

// ── Numerazione degli esercizi della teoria ───────────────────────────
// Ogni esercizio della teoria riceve un numero, qualunque sia il suo nome
// ("Verifica Subito!", "Prova tu!", "Isola le altre grandezze", "Trova
// l'unità di misura", un completamento, una scheda Frayer…): una sola serie
// per capitolo, nell'ordine della pagina. Il numero compare in un cerchietto
// accanto all'etichetta (o all'inizio del widget, se non ha etichetta), il
// riquadro riceve l'ancora #es-N e l'attributo data-es (usato dalle consegne
// e dai compiti "esercizi: [3, 5]").
// Restano senza numero: i riquadri d'esempio già risolti (niente a cui
// rispondere), le simulazioni/laboratori e gli esercizi di riepilogo (ex.html,
// che hanno la loro numerazione).
(function() {
  var prose = document.querySelector('.chapter-prose');
  if (!prose) return;
  // ciò a cui si risponde (gli slider delle simulazioni non contano)
  var RISPOSTA = 'input:not([type=range]), select, textarea, .tf-btn, .iex-choice-btn, .qgf-btn-si, .match-widget, .sort-widget, .order-widget';
  // widget che sono esercizi anche senza un riquadro intorno
  var SCIOLTI = '.mclic-widget, .uderive-widget, .invx-widget, .ubx-widget, .frayer, .fillm-wrap, .fill-wrap, .sci-wrap, .sciex-widget, .tplcz-widget, ' +
                '.match-widget, .sort-widget, .order-widget, .qgf-widget, .tf-item, .iex-choices, .raperta, .riflessione';
  var CAND = '.iex-widget, .box.box-ex, .iex-lbl, ' + SCIOLTI;
  var n = 0;
  // un'etichetta scritta direttamente nel testo (senza un riquadro tutto suo):
  // raccolgo lei e ciò che la segue, fino al prossimo titolo o esercizio
  function fine(x) { return /^H[1-6]$/.test(x.tagName) || x.matches('.box, .iex-widget, .iex-lbl') || !!x.querySelector('.iex-widget, .iex-lbl, .box'); }
  function raggruppa(lbl) {
    var w = document.createElement('div'), x = lbl;
    w.className = 'es-gruppo';
    lbl.parentNode.insertBefore(w, lbl);
    while (x) {
      var dopo = x.nextSibling;
      w.appendChild(x);
      x = dopo;
      if (x && x.nodeType === 1 && fine(x)) break;
    }
    return w;
  }
  [].slice.call(prose.querySelectorAll(CAND)).forEach(function(el) {
    if (el.closest('[data-es], .ex-box')) return; // già dentro un esercizio numerato, o esercizio di riepilogo
    var box = el, lbl = null;
    if (el.matches('.iex-lbl')) { box = raggruppa(el); lbl = el; }
    else if (el.matches('.box.box-ex')) {
      lbl = el.querySelector(':scope > .box-label');
      var titolo = /^\s*(Esercizio|Verifica Subito|Prova tu)\b/i.test(lbl ? lbl.textContent : '');
      if (!titolo && !el.querySelector(RISPOSTA + ', ' + SCIOLTI)) return; // un esempio già risolto
    }
    else if (el.matches('.iex-widget')) lbl = el.querySelector('.iex-lbl');
    else lbl = el.querySelector(':scope > [class*="-lbl"], :scope > [class*="title"], :scope > [class*="titolo"]');
    n++;
    box.dataset.es = n;
    if (!box.id) box.id = 'es-' + n;
    var b = document.createElement('span');
    b.className = 'es-num'; b.textContent = n; b.title = 'Esercizio ' + n;
    if (lbl) {
      // "Esercizio 3 — Titolo": il numero scritto a mano lascia il posto a quello nel cerchietto
      var t = lbl.firstChild;
      if (t && t.nodeType === 3 && /^\s*Esercizio\b/i.test(t.data)) {
        var resto = t.data.replace(/^\s*Esercizio[\s ]*\d*[\s ]*(?:[—–-][\s ]*)?/i, '');
        t.data = resto ? 'Esercizio — ' + resto : 'Esercizio';
      }
      lbl.insertBefore(b, lbl.firstChild);
    } else box.insertBefore(b, box.firstChild);
  });
})();

// ── Numerazione automatica delle figure (come \ref in LaTeX) ──────────
(function() {
  var map = {};
  document.querySelectorAll('.fig-num[data-fig-id]').forEach(function(el, i) {
    var n = i + 1;
    map[el.getAttribute('data-fig-id')] = n;
    el.textContent = 'Figura ' + n;
  });
  document.querySelectorAll('.fig-ref[data-fig-ref]').forEach(function(el) {
    var n = map[el.getAttribute('data-fig-ref')];
    if (n) el.textContent = 'Figura ' + n;
  });
})();

// ── Stampa / PDF ───────────────────────────────────────────────
// I video (YouTube, BBC…) e le simulazioni PhET diventano QR code: sono
// generati qui nella pagina (assets/js/qrcode.min.js), quindi ci sono sempre,
// anche stampando con Ctrl+P. Il pulsante "Esporta come PDF" apre prima una
// finestrella di opzioni: dimensione del testo, margini, spoiler aperti o
// chiusi, immagini sì o no. Il numero di pagina è nel CSS (@page).
(function() {
  function esc(t) { return String(t).replace(/[&<>"]/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function qrSvg(url) {
    if (!window.qrcode) return '';
    var q = qrcode(0, 'M'); q.addData(url); q.make();
    return q.createSvgTag({ cellSize: 2, margin: 0, scalable: true });
  }
  function didascalia(el) {
    var n = el.nextElementSibling;
    return n && n.classList.contains('video-caption') ? n.textContent.trim() : '';
  }
  function aggiungiQR(dopo, url, testo) {
    var d = document.createElement('div');
    d.className = 'video-qr-print';
    d.innerHTML = '<div class="video-qr-code">' + qrSvg(url) + '</div>' +
      '<div class="video-qr-txt">' + (testo ? '<p class="video-qr-cap">' + esc(testo) + '</p>' : '') +
      '<p class="video-qr-url">' + esc(url) + '</p></div>';
    var n = dopo.nextElementSibling;
    if (n && n.classList.contains('video-caption')) dopo = n; // il QR va sotto la didascalia
    dopo.parentNode.insertBefore(d, dopo.nextSibling);
  }
  function preparaQR() {
    document.querySelectorAll('.video-wrap iframe').forEach(function(f) {
      var m = f.src.match(/youtube(?:-nocookie)?\.com\/embed\/([^?&\/]+)/);
      var url = m ? 'https://www.youtube.com/watch?v=' + m[1] : f.src;
      aggiungiQR(f.parentNode, url, f.title || 'Video');
    });
    document.querySelectorAll('.video-link[data-url]').forEach(function(a) {
      aggiungiQR(a, a.getAttribute('data-url'), a.getAttribute('data-titolo') || 'Video');
    });
    document.querySelectorAll('.phet-wrap iframe').forEach(function(f) {
      aggiungiQR(f.parentNode, f.src, 'Simulazione interattiva' + (didascalia(f.parentNode) ? '' : ' (PhET)'));
    });
  }
  // stampa "senza esercizi": via gli esercizi di riepilogo, e al posto di ogni
  // esercizio numerato solo una barra "N Verifica Subito! — Visualizza sul sito"
  function preparaBarre() {
    var prose = document.querySelector('.chapter-prose');
    if (!prose) return;
    prose.querySelectorAll('[data-es]').forEach(function(el) {
      var lbl = el.querySelector('.box-label, .iex-lbl');
      var t = lbl ? lbl.textContent.replace(/^\s*\d+/, '').replace(/^\s*Esercizio\s*\d*\s*[—–-]?\s*/i, '').trim() : '';
      if (!/^(Verifica Subito|Prova tu)/i.test(t)) t = 'Verifica Subito!';
      var b = document.createElement('a');
      b.className = 'es-barra-stampa';
      b.href = location.href.split('#')[0] + '#' + (el.id || '');
      b.innerHTML = '<span class="es-num">' + el.dataset.es + '</span><span class="es-barra-t">' + esc(t) + '</span><span class="es-barra-link">Visualizza sul sito</span>';
      el.parentNode.insertBefore(b, el);
    });
    prose.querySelectorAll('h1').forEach(function(h) {
      if (!/^\s*Esercizi di riepilogo\s*$/i.test(h.textContent)) return;
      for (var x = h; x && !(x !== h && x.tagName === 'H1'); x = x.nextElementSibling) x.classList.add('riepilogo-stampa');
    });
  }
  function prepara() { preparaQR(); preparaBarre(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', prepara); else prepara();

  // ── opzioni di stampa ──
  var DEF = { testo: 100, margini: 15, spoiler: 'chiusi', immagini: true, esercizi: false };
  function leggi() { try { var o = JSON.parse(localStorage.getItem('lv-stampa') || '{}'); for (var k in DEF) if (!(k in o)) o[k] = DEF[k]; return o; } catch (e) { return JSON.parse(JSON.stringify(DEF)); } }
  function salva(o) { try { localStorage.setItem('lv-stampa', JSON.stringify(o)); } catch (e) {} }
  var stile = document.createElement('style'); document.head.appendChild(stile);
  var aperti = [];
  function applica(o) {
    stile.textContent = '@page { margin: ' + o.margini + 'mm; }' +
      '@media print { .main-content { zoom: ' + (o.testo / 100) + '; } }';
    document.documentElement.classList.toggle('stampa-senza-immagini', !o.immagini);
    document.documentElement.classList.toggle('stampa-senza-esercizi', !o.esercizi);
    if (o.spoiler === 'aperti') document.querySelectorAll('details.spoiler:not([open])').forEach(function(d) { d.open = true; aperti.push(d); });
  }
  window.addEventListener('beforeprint', function() { if (!aperti.length) applica(leggi()); });
  window.addEventListener('afterprint', function() { aperti.forEach(function(d) { d.open = false; }); aperti = []; });

  var box = null;
  window.exportPDF = function() {
    if (!box) {
      box = document.createElement('div');
      box.className = 'stampa-dlg'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Opzioni di stampa');
      box.innerHTML =
        '<div class="stampa-pan">' +
        '<h4>Esporta come PDF</h4>' +
        '<label class="stampa-riga">Dimensione del testo <b class="stampa-v" data-v="testo"></b>' +
          '<input type="range" min="60" max="110" step="5" data-k="testo"></label>' +
        '<label class="stampa-riga">Margini <b class="stampa-v" data-v="margini"></b>' +
          '<input type="range" min="5" max="25" step="1" data-k="margini"></label>' +
        '<div class="stampa-riga">Spoiler ' +
          '<span class="stampa-scelta"><label><input type="radio" name="stampa-sp" value="chiusi"> chiusi</label>' +
          '<label><input type="radio" name="stampa-sp" value="aperti"> aperti</label></span></div>' +
        '<label class="stampa-riga stampa-check"><input type="checkbox" data-k="immagini"> Stampa le immagini</label>' +
        '<label class="stampa-riga stampa-check"><input type="checkbox" data-k="esercizi"> Stampa gli esercizi</label>' +
        '<p class="stampa-nota">Senza esercizi, al posto di ogni Verifica Subito resta solo una barra, e gli esercizi di riepilogo non si stampano. I video diventano QR code; ogni pagina ha il suo numero. Nella finestra di stampa scegli “Salva come PDF”.</p>' +
        '<div class="stampa-bott"><button type="button" class="stampa-annulla">Annulla</button>' +
        '<button type="button" class="stampa-vai">Stampa / salva PDF</button></div>' +
        '</div>';
      document.body.appendChild(box);
      function mostra() {
        var o = leggi();
        box.querySelector('[data-k=testo]').value = o.testo;
        box.querySelector('[data-k=margini]').value = o.margini;
        box.querySelector('[data-k=immagini]').checked = o.immagini;
        box.querySelector('[data-k=esercizi]').checked = o.esercizi;
        box.querySelector('input[name=stampa-sp][value=' + o.spoiler + ']').checked = true;
        box.querySelector('[data-v=testo]').textContent = o.testo + '%';
        box.querySelector('[data-v=margini]').textContent = o.margini + ' mm';
      }
      function prendi() {
        return {
          testo: +box.querySelector('[data-k=testo]').value,
          margini: +box.querySelector('[data-k=margini]').value,
          immagini: box.querySelector('[data-k=immagini]').checked,
          esercizi: box.querySelector('[data-k=esercizi]').checked,
          spoiler: box.querySelector('input[name=stampa-sp]:checked').value
        };
      }
      box.addEventListener('input', function() { salva(prendi()); mostra(); });
      box.addEventListener('change', function() { salva(prendi()); mostra(); });
      box.querySelector('.stampa-annulla').onclick = function() { box.hidden = true; };
      box.addEventListener('click', function(e) { if (e.target === box) box.hidden = true; });
      document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && box && !box.hidden) box.hidden = true; });
      box.querySelector('.stampa-vai').onclick = function() {
        var o = prendi(); salva(o); box.hidden = true;
        applica(o);
        setTimeout(function() { window.print(); }, 50);
      };
      box._mostra = mostra;
    }
    box._mostra(); box.hidden = false;
    box.querySelector('.stampa-vai').focus();
  };
})();

// ── Font accessibility toggle ──────────────────────────────────
function toggleFont() {
  const body = document.body;
  const btn  = document.getElementById('font-toggle');
  const active = body.classList.toggle('accessible-font');
  btn.setAttribute('aria-pressed', active.toString());
  btn.textContent = active ? 'Aa  standard' : 'Aa\u2009 leggibilità';
  localStorage.setItem('lv-font', active ? '1' : '');
}
(function() {
  if (localStorage.getItem('lv-font')) {
    document.body.classList.add('accessible-font');
    const btn = document.getElementById('font-toggle');
    if (btn) { btn.setAttribute('aria-pressed','true'); btn.textContent = 'Aa  standard'; }
  }
})();

// ── Reading progress bar ───────────────────────────────────────
(function() {
  var bar = document.getElementById('read-progress');
  var pct = document.getElementById('read-progress-pct');
  if (!bar) return;
  function update() {
    var doc = document.documentElement;
    var scrolled = doc.scrollTop || document.body.scrollTop;
    var total = doc.scrollHeight - doc.clientHeight;
    var p = total > 0 ? (scrolled / total * 100) : 0;
    bar.style.width = p + '%';
    if (pct) pct.textContent = Math.round(p) + '%';
  }
  window.addEventListener('scroll', update, { passive: true });
  update();
})();

// ── Evita che la punteggiatura subito dopo una formula inline (es. "$F=ma$,")
//    venga orfanizzata sulla riga successiva. Inserisce un WORD JOINER (U+2060,
//    invisibile) fra la formula e la punteggiatura: dice al motore di line-breaking
//    "non spezzare qui", senza toccare white-space (quindi le formule lunghe
//    possono ancora andare a capo internamente quando serve). Un MutationObserver
//    copre sia il primo typeset di MathJax sia i re-typeset dinamici dei widget.
(function() {
  var PUNCT = /^[,.;:!?)\]]/;
  function fix(mjx) {
    if (mjx.getAttribute('display') === 'true') return;
    if (mjx._punctFixed) return;
    var next = mjx.nextSibling;
    if (next && next.nodeType === 3 && PUNCT.test(next.textContent)) {
      mjx._punctFixed = true;
      mjx.parentNode.insertBefore(document.createTextNode('\u2060'), next);
    }
  }
  document.querySelectorAll('mjx-container').forEach(fix);
  new MutationObserver(function(muts) {
    muts.forEach(function(m) {
      m.addedNodes.forEach(function(n) {
        if (n.nodeType !== 1) return;
        if (n.tagName === 'MJX-CONTAINER') fix(n);
        else if (n.querySelectorAll) n.querySelectorAll('mjx-container').forEach(fix);
      });
    });
  }).observe(document.body, { childList: true, subtree: true });
})();

// ── Sidebar TOC: costruisce l'indice e segna la sezione attiva ─
(function() {
  var toc   = document.getElementById('sidebar-toc');
  var prose = document.querySelector('.chapter-prose');
  if (!toc || !prose) return;

  var headings = prose.querySelectorAll('h1, h2');
  if (!headings.length) return;

  var items = [];
  var h1count = 0;
  headings.forEach(function(h) {
    if (!h.id) {
      h.id = 'sec-' + h.textContent.trim().toLowerCase()
        .replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').slice(0, 40);
    }
    var li = document.createElement('li');
    if (h.tagName === 'H2') {
      li.className = 'toc-h2';
    } else {
      h1count++;
    }
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = (h.tagName === 'H1' ? h1count + '. ' : '') + h.textContent;
    li.appendChild(a);
    toc.appendChild(li);
    items.push({ el: h, link: a });
  });

  var OFFSET = 80;
  function updateActive() {
    var scrollY = window.scrollY + OFFSET;
    var current = null;
    items.forEach(function(item) {
      if (item.el.getBoundingClientRect().top + window.scrollY <= scrollY) current = item;
    });
    items.forEach(function(item) { item.link.classList.remove('active'); });
    if (current) current.link.classList.add('active');
  }
  window.addEventListener('scroll', updateActive, { passive: true });
  updateActive();
})();

// ── Formule inline più larghe della riga: diventano scorrevoli ───────
// (le formule in display scorrono già via CSS; quelle inline solo se
// davvero non ci stanno, per non toccare l'allineamento delle altre)
(function() {
  var prose = document.querySelector('.chapter-prose');
  if (!prose) return;
  function blockOf(el) {
    var a = el.parentElement;
    while (a && a !== prose && getComputedStyle(a).display.indexOf('inline') === 0) a = a.parentElement;
    return a || prose;
  }
  function check() {
    prose.querySelectorAll('mjx-container:not([display="true"])').forEach(function(m) {
      m.classList.remove('mjx-wide');
      var b = blockOf(m);
      if (m.getBoundingClientRect().right > b.getBoundingClientRect().right + 1) m.classList.add('mjx-wide');
    });
  }
  var t = null;
  function later() { clearTimeout(t); t = setTimeout(check, 200); }
  var tries = 0;
  (function wait() {
    var mj = window.MathJax;
    if (mj && mj.startup && mj.startup.promise) { mj.startup.promise.then(check); return; }
    if (++tries < 60) setTimeout(wait, 100);
  })();
  window.addEventListener('resize', later);
  document.addEventListener('toggle', later, true); // spoiler e soluzioni aperti
  document.addEventListener('click', later, true);  // slide dei caroselli, schede: formule prima nascoste
})();

// ── Stampa: carica subito le immagini "pigre" non ancora arrivate ────
// (altrimenti nel PDF mancherebbero le figure più in basso nella pagina)
window.addEventListener('beforeprint', function() {
  document.querySelectorAll('img[loading="lazy"]').forEach(function(img) { img.loading = 'eager'; });
});
// ── Esiti degli esercizi: pallini colorati e fuochi d'artificio ──────────────
// Ogni "unità" di un esercizio che ha una risposta giusta o sbagliata (vero/falso,
// scelta multipla, completamento, valore numerico, notazione scientifica, isola,
// unità di misura, trascina, ordina, abbina…) comunica il suo esito con
// _lvSave/_lvEsito o con l'evento iex:correct. Nei caroselli scritti a mano
// (_includes/esercizi) un passo senza widget riconoscibili conta come un'unità
// a sé: il suo esito si legge dal riquadro di risposta .iex-fb (ok / err).
//  - Pallini: il pallino di una slide (scorri) o di un passo (iex) diventa verde
//    quando tutte le sue unità sono giuste, rosso se una è sbagliata (data-lv).
//  - Fuochi: quando tutte le unità di un esercizio numerato (data-es) sono
//    giuste, e giuste al primo colpo in questa visita della pagina.
// Un nuovo widget con risposta giusta/sbagliata deve avere la classe radice in
// UNIT e comunicare l'esito come sopra.
(function() {
  var UNIT = '.qgf-widget, .iex-choices, .fillm-wrap, .fill-wrap, .tf-item, .invx-widget, .uderive-widget, .sort-widget, .match-widget, .vdrag-widget, ' +
             '.num-wrap, .sci-wrap, .order-widget, .ubx-widget, .sciex-widget, .tplcz-widget, .mclic-widget';
  var RISP = 'input:not([type=range]):not([type=hidden]), select, .iex-vbtn, .iex-choice-btn';
  var last = null, lastT = 0, rec = new WeakMap(), stato = new WeakMap(), lastFire = 0;
  ['pointerdown', 'keydown', 'input', 'change', 'click'].forEach(function(t) {
    document.addEventListener(t, function(e) { if (e.isTrusted && e.target && e.target.nodeType === 1) { last = e.target; lastT = Date.now(); } }, true);
  });
  function dalVivo() { return Date.now() - lastT < 6000; }
  function esitoDi(ns, d) {
    if (!d || typeof d !== 'object') return null;
    if (typeof d.right === 'boolean') return d.right ? 1 : 0;
    if (typeof d.found === 'boolean') return d.found ? 1 : 0;
    if (typeof d.ok === 'boolean') return d.ok ? 1 : 0;
    if (typeof d.ok === 'number') return d.ok;
    if (ns === 'quiz' && typeof d.allOk === 'boolean') return d.allOk ? 1 : 0; // il quiz salva solo quando è finito
    if (ns === 'uderive') return 1;
    return null; // riassunti di un intero carosello (ok: [...]): non sono l'esito di una singola risposta
  }
  // fuochi d'artificio (condivisi: anche il quiz vero/falso li usa), mai due volte di fila
  window._lvFuochi = function() {
    if (Date.now() - lastFire < 2500) return; lastFire = Date.now();
    var canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
    canvas.width = window.innerWidth; canvas.height = window.innerHeight; document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d'), cols = ['#fbbf24', '#ef4444', '#0891b2', '#22d3ee', '#10b981', '#f472b6', '#fff', '#fde68a'];
    var bursts = [], cnt = 0, max = 7;
    function burst() {
      var cx = innerWidth * (.15 + Math.random() * .7), cy = innerHeight * (.08 + Math.random() * .5), col = cols[Math.floor(Math.random() * cols.length)], ps = [];
      for (var k = 0; k < 110; k++) { var a = Math.random() * Math.PI * 2, sp = Math.random() * 7 + 2; ps.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: Math.random() * 3 + 1, col: col, a: 1 }); }
      bursts.push(ps);
    }
    burst();
    var t = setInterval(function() { cnt++; if (cnt < max) burst(); else clearInterval(t); }, 300);
    (function frame() {
      ctx.fillStyle = 'rgba(0,0,0,0.13)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      var alive = false;
      bursts.forEach(function(ps) { ps.forEach(function(p) {
        p.x += p.vx; p.y += p.vy; p.vy += .07; p.a -= .017; if (p.a <= 0) return; alive = true;
        ctx.beginPath(); ctx.globalAlpha = p.a; ctx.fillStyle = p.col; ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }); });
      ctx.globalAlpha = 1;
      if (alive || cnt < max) requestAnimationFrame(frame); else canvas.remove();
    })();
  };

  // un passo di un carosello scritto a mano, senza widget riconoscibili dentro
  function passoLibero(r) { return r && !r.querySelector(UNIT) && r.querySelector(RISP) && r.querySelector('.iex-fb'); }
  // l'unità a cui appartiene un elemento: il widget più esterno, o il passo libero
  function unitaDi(el) {
    if (!el || !el.closest) return null;
    var u = el.closest(UNIT), x = u;
    while (x && x.parentElement && (x = x.parentElement.closest(UNIT))) u = x;
    if (u) return u;
    var r = el.closest('.iex-q');
    return passoLibero(r) ? r : null;
  }
  function unitaIn(root) {
    var a = [].slice.call(root.querySelectorAll(UNIT)).filter(function(u) { var p = u.parentElement.closest(UNIT); return !p || !root.contains(p); });
    [].forEach.call(root.querySelectorAll('.iex-q'), function(r) { if (passoLibero(r)) a.push(r); });
    if (root.matches && root.matches('.iex-q') && passoLibero(root)) a.push(root);
    return a;
  }
  // 1 = tutto giusto, 0 = qualcosa di sbagliato, null = non ancora fatto (o a metà)
  function statoDi(root) {
    var us = unitaIn(root); if (!us.length) return null;
    var tutte = true, sbagliata = false;
    us.forEach(function(u) { var s = stato.get(u); if (s !== 1) tutte = false; if (s === 0) sbagliata = true; });
    return tutte ? 1 : sbagliata ? 0 : null;
  }
  window._lvStato = statoDi;
  function pallinoDi(slot) {
    var cont = slot.parentElement, dots = null, fratelli;
    if (slot.matches('.iex-q')) { dots = cont.querySelector(':scope > .iex-topnav .iex-dots'); fratelli = cont.querySelectorAll(':scope > .iex-q'); }
    else { // slide: il suo pallino (le slide con un quiz hanno un pallino per affermazione, colorati da scorri-end.html)
      var sc = cont.parentElement; dots = sc && sc.querySelector('.scorri-dots'); if (!dots) return null;
      var k = [].indexOf.call(cont.querySelectorAll(':scope > .scorri-slide'), slot);
      return dots.querySelector('.scorri-dot[data-slide="' + k + '"]:not([data-qk])');
    }
    if (!dots) return null;
    var i = [].indexOf.call(fratelli, slot);
    return i >= 0 ? dots.children[i] : null;
  }
  function colora(slot) {
    var d = pallinoDi(slot); if (!d) return;
    var s = statoDi(slot);
    if (s === 1) d.dataset.lv = 'ok'; else if (s === 0) d.dataset.lv = 'no'; else delete d.dataset.lv;
  }
  function segna(unit, ok, vivo) {
    if (!unit || ok === null || ok === undefined) return;
    stato.set(unit, ok);
    if (vivo) { var r = rec.get(unit); if (!r) { r = { first: ok }; rec.set(unit, r); } r.last = ok; }
    var slot = unit.parentElement && unit.parentElement.closest('.iex-q, .scorri-slide');
    if (unit.matches('.iex-q')) slot = unit;
    while (slot) { colora(slot); slot = slot.parentElement && slot.parentElement.closest('.iex-q, .scorri-slide'); }
    document.dispatchEvent(new CustomEvent('lv:esito'));
    if (!vivo) return;
    var box = unit.closest('[data-es]'); if (!box || box.dataset.fuochi) return;
    var us = unitaIn(box);
    var tutte = us.length && us.every(function(u) { var x = rec.get(u); return x && x.first === 1 && x.last === 1; });
    if (tutte) { box.dataset.fuochi = '1'; setTimeout(window._lvFuochi, 600); }
  }
  var origSave = window._lvSave, origEsito = window._lvEsito;
  if (origSave) window._lvSave = function(ns, id, data) {
    var r = origSave.apply(this, arguments);
    try { if (dalVivo()) segna(unitaDi(last), esitoDi(ns, data), true); } catch (e) {}
    return r;
  };
  window._lvEsito = function(ns, id, giusto) {
    if (origEsito) origEsito.apply(this, arguments);
    try { if (dalVivo()) segna(unitaDi(last), giusto ? 1 : 0, true); } catch (e) {}
  };
  document.addEventListener('iex:correct', function(e) {
    var u = unitaDi(e.target) || (e.target.querySelector && unitaDi(e.target.querySelector(UNIT)));
    if (u) segna(u, 1, dalVivo());
  });
  // caroselli scritti a mano: l'esito di un passo si legge dal suo riquadro di risposta
  function osservaPassi() {
    [].forEach.call(document.querySelectorAll('.iex-q'), function(r) {
      function leggi(vivo) {
        var fb = [].slice.call(r.querySelectorAll('.iex-fb')).filter(function(f) { return f.closest('.iex-q') === r; });
        var err = fb.some(function(f) { return f.classList.contains('err'); }), ok = fb.length && fb.every(function(f) { return f.classList.contains('ok') || !f.textContent.trim(); }) && fb.some(function(f) { return f.classList.contains('ok'); });
        if (passoLibero(r)) { if (err) segna(r, 0, vivo); else if (ok) segna(r, 1, vivo); }
        else if (err) unitaIn(r).forEach(function(u) { if (!stato.has(u)) segna(u, 0, vivo); });
      }
      leggi(false);
      new MutationObserver(function() { leggi(dalVivo()); }).observe(r, { attributes: true, subtree: true, attributeFilter: ['class'] });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', osservaPassi); else osservaPassi();
})();
</script>

{% comment %}
Figura statica: il vettore campo elettrico in un punto P a distanza r da una
carica Q, nei due casi: Q positiva (il campo punta lontano da Q) e Q negativa
(il campo punta verso Q). Stessa grafica di figura-vettore-campo-g.html.
Nessun parametro.
{% endcomment %}
<div class="fig-block">
<svg viewBox="0 0 640 170" width="100%" style="max-width:600px;height:auto;display:block;margin:0 auto;" role="img" aria-label="Vettore campo elettrico in un punto P: si allontana da una carica positiva, punta verso una carica negativa">
  <defs>
    <radialGradient id="evecP" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#fff1f2"/><stop offset="55%" stop-color="#fecdd3"/><stop offset="100%" stop-color="#fda4af"/></radialGradient>
    <radialGradient id="evecN" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#eff6ff"/><stop offset="55%" stop-color="#bfdbfe"/><stop offset="100%" stop-color="#93c5fd"/></radialGradient>
    <marker id="evecArrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0.3 L6.6,3.5 L0,6.7 L1.7,3.5 Z" fill="#0891b2"/></marker>
  </defs>
  <!-- carica positiva: il campo si allontana -->
  <line x1="60" y1="80" x2="250" y2="80" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="155" y="70" text-anchor="middle" font-size="14" font-style="italic" fill="#64748b">r</text>
  <circle cx="60" cy="80" r="30" fill="url(#evecP)" stroke="#9f1239" stroke-width="1.3"/>
  <text x="60" y="88" text-anchor="middle" font-size="24" font-weight="700" fill="#9f1239">+</text>
  <text x="60" y="132" text-anchor="middle" font-size="14" font-style="italic" fill="#9f1239">Q &gt; 0</text>
  <circle cx="250" cy="80" r="5" fill="#475569"/>
  <text x="250" y="102" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">P</text>
  <line x1="250" y1="80" x2="306" y2="80" stroke="#0891b2" stroke-width="3.5" marker-end="url(#evecArrow)"/>
  <text x="290" y="66" text-anchor="middle" font-size="16" font-weight="600" font-style="italic" fill="#0891b2">E</text>
  <path d="M284,52 l12,0 l-3,-2.5 M296,52 l-3,2.5" stroke="#0891b2" stroke-width="1.3" fill="none"/>
  <!-- carica negativa: il campo punta verso la carica -->
  <line x1="380" y1="80" x2="570" y2="80" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="475" y="70" text-anchor="middle" font-size="14" font-style="italic" fill="#64748b">r</text>
  <circle cx="380" cy="80" r="30" fill="url(#evecN)" stroke="#1e3a8a" stroke-width="1.3"/>
  <text x="380" y="88" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a8a">−</text>
  <text x="380" y="132" text-anchor="middle" font-size="14" font-style="italic" fill="#1e3a8a">Q &lt; 0</text>
  <circle cx="570" cy="80" r="5" fill="#475569"/>
  <text x="570" y="102" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">P</text>
  <line x1="570" y1="80" x2="514" y2="80" stroke="#0891b2" stroke-width="3.5" marker-end="url(#evecArrow)"/>
  <text x="530" y="66" text-anchor="middle" font-size="16" font-weight="600" font-style="italic" fill="#0891b2">E</text>
  <path d="M524,52 l12,0 l-3,-2.5 M536,52 l-3,2.5" stroke="#0891b2" stroke-width="1.3" fill="none"/>
</svg>
<figcaption><span class="fig-num" data-fig-id="vettore-campo-e">Figura</span> — Il vettore campo elettrico $\vec E$ nel punto $P$, a distanza $r$ dalla carica $Q$: si allontana da una carica positiva (a sinistra) e punta verso una carica negativa (a destra).</figcaption>
</div>

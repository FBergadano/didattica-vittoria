{% comment %}
Funzioni condivise per salvare le risposte degli esercizi nel browser
dello studente (localStorage, nessun login/account). Vanno incluse nel
<head>, prima del contenuto della pagina, perché i widget (tf, fill,
num, sci, quiz, match, sort, ecc.) le richiamano nel loro <script>
inline appena la pagina viene disegnata.
{% endcomment %}
<script>
(function() {
  // Ogni pagina ha il proprio namespace (location.pathname): non serve
  // coordinarsi fra widget di pagine diverse, anche se riusano lo stesso id.
  // "V" permette in futuro di invalidare tutte le risposte salvate
  // cambiando semplicemente questo prefisso (es. dopo una revisione
  // grossa dei contenuti che rende le vecchie risposte non pertinenti).
  var V = 'v1';
  function key(ns, id) { return 'lv-ans:' + V + ':' + location.pathname + ':' + ns + ':' + id; }
  window._lvSave = function(ns, id, data) {
    try { localStorage.setItem(key(ns, id), JSON.stringify(data)); } catch (e) {}
  };
  window._lvLoad = function(ns, id) {
    try { var v = localStorage.getItem(key(ns, id)); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  };
  window._lvClear = function(ns, id) {
    try { localStorage.removeItem(key(ns, id)); } catch (e) {}
  };
  // Hash breve e stabile di una stringa, usato come id per i widget
  // (tf, fill) che non ne ricevono uno esplicito dall'autore.

  // Coriandoli di "risposta giusta", usati da tutti i widget (tf, fill, num,
  // sci, mcq, quiz, match, sort, ...): definiti una volta sola qui.
  window._shoot = function(el){var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cl=['#c026d3','#0891b2','#0f766e','#f59e0b','#dc2626','#65a30d','#ec4899'];for(var i=0;i<45;i++){var p=document.createElement('div'),a=Math.random()*Math.PI*2,sp=3+Math.random()*6;p.style.cssText='position:fixed;width:6px;height:6px;background:'+cl[i%cl.length]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';left:'+cx+'px;top:'+cy+'px;pointer-events:none;z-index:9999;';document.body.appendChild(p);(function(p,vx,vy,x,y){var op=1;function s(){vy+=.25;x+=vx;y+=vy;op-=.02;p.style.left=x+'px';p.style.top=y+'px';p.style.opacity=op;if(op>0)requestAnimationFrame(s);else p.remove();}requestAnimationFrame(s);})(p,Math.cos(a)*sp,Math.sin(a)*sp-4,cx,cy);}};
  window._lvHash = function(s) {
    var h = 0; s = String(s);
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
    return (h >>> 0).toString(36);
  };

  // ── Salvataggio automatico di tutti i campi della pagina ──────────────
  // Molti widget salvano solo quando si preme "Verifica": qui ogni campo
  // (input, textarea, select, caselle) viene salvato mentre lo si compila,
  // e rimesso al suo posto quando si riapre la pagina. Se il widget ha già
  // ripristinato da sé il proprio valore (con l'esito della verifica), il
  // campo non viene toccato.
  // La chiave di ogni campo è il suo id, se c'è; altrimenti un'impronta del
  // testo che lo circonda, calcolata all'apertura della pagina (prima che
  // compaiano messaggi di esito o formule MathJax), più un contatore per
  // distinguere campi con lo stesso contesto.
  var SKIP = '.lv-ui, .gchat-widget, [data-nosave]';
  var CTX = '.sci-wrap, .fill-wrap, .iex-ir, .iex-q, .tf-item, li, p, td, tr, label, figure, .box, div';
  var keys = new WeakMap();
  function isField(el) {
    if (!el || !el.matches || !el.matches('input, textarea, select')) return false;
    var t = (el.type || '').toLowerCase();
    if (['button', 'submit', 'reset', 'hidden', 'file', 'password', 'image'].indexOf(t) >= 0) return false;
    return !!el.closest('main') && !el.closest(SKIP);
  }
  // Testo del contesto, ignorando formule (prima o dopo MathJax), messaggi di
  // esito e pulsanti, che possono cambiare fra un caricamento e l'altro.
  var NOISE = 'mjx-container, script, style, button, select, .lv-ui, [class*="fb"], [class*="feedback"]';
  function ctxText(c) {
    var out = '', w = document.createTreeWalker(c, NodeFilter.SHOW_TEXT, null), n;
    while ((n = w.nextNode())) { var p = n.parentElement; if (p && !p.closest(NOISE)) out += n.data; }
    return out.replace(/\$\$[\s\S]*?\$\$|\$[^$]*\$|\\\([\s\S]*?\\\)/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 160);
  }
  function sigOf(el) {
    var c = el.parentElement && el.parentElement.closest(CTX);
    var txt = c ? ctxText(c) : '';
    return el.tagName + '|' + (el.type || '') + '|' + (el.name || '') + '|' + (el.placeholder || '') + '|' + txt;
  }
  function assignKeys() {
    var seen = {};
    document.querySelectorAll('main input, main textarea, main select').forEach(function(el) {
      if (!isField(el) || keys.has(el)) return;
      var k;
      if (el.id) k = 'id:' + el.id;
      else { var s = _lvHash(sigOf(el)); seen[s] = (seen[s] || 0) + 1; k = s + ':' + seen[s]; }
      keys.set(el, k);
    });
  }
  function keyOf(el) {
    if (!keys.has(el)) { assignKeys(); if (!keys.has(el)) keys.set(el, _lvHash(sigOf(el)) + ':x'); }
    return keys.get(el);
  }
  function stateOf(el) {
    var t = (el.type || '').toLowerCase();
    return (t === 'checkbox' || t === 'radio') ? { c: el.checked } : { v: el.value };
  }
  function onEdit(e) {
    var el = e.target;
    if (!isField(el)) return;
    _lvSave('field', keyOf(el), stateOf(el));
  }
  document.addEventListener('input', onEdit, true);
  document.addEventListener('change', onEdit, true);
  document.addEventListener('DOMContentLoaded', function() {
    assignKeys(); // prima che i widget ripristinino esiti e messaggi
    setTimeout(function() {
      document.querySelectorAll('main input, main textarea, main select').forEach(function(el) {
        if (!isField(el)) return;
        var s = _lvLoad('field', keyOf(el));
        if (!s) return;
        var t = (el.type || '').toLowerCase();
        if (t === 'checkbox' || t === 'radio') {
          if (el.checked !== !!s.c) { el.checked = !!s.c; el.dispatchEvent(new Event('change', { bubbles: true })); }
        } else if (el.tagName === 'SELECT') {
          // una tendina non è mai "vuota": la ripristino solo se è ancora sulla prima voce
          if (s.v !== undefined && el.selectedIndex <= 0 && el.value !== s.v) {
            el.value = s.v; el.dispatchEvent(new Event('change', { bubbles: true }));
          }
        } else if (s.v !== undefined && s.v !== '' && el.value === '') {
          el.value = s.v;
          el.dispatchEvent(new Event('input', { bubbles: true }));
        }
      });
    }, 0);
  });
})();
</script>

{% comment %}
Animazione in loop (solo CSS, nessuno script): compaiono in sequenza le due
forze elettriche repulsive F1 e F2, poi le linee che completano il
parallelogramma, infine la forza totale. Nessun parametro.
{% endcomment %}
<div class="fig-block">
<svg viewBox="0 0 360 280" width="100%" style="max-width:320px;height:auto;display:block;margin:0 auto;" role="img" aria-label="Animazione: le due forze elettriche repulsive e la loro somma vettoriale">
  <defs>
    <radialGradient id="pcQ1" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff1f2"/><stop offset="55%" stop-color="#fecdd3"/><stop offset="100%" stop-color="#fda4af"/>
    </radialGradient>
    <radialGradient id="pcQ2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff1f2"/><stop offset="55%" stop-color="#fca5ad"/><stop offset="100%" stop-color="#e11d48"/>
    </radialGradient>
    <radialGradient id="pcq" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="55%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <marker id="pcArrowRed" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0.3 L6.6,3.5 L0,6.7 L1.7,3.5 Z" fill="#dc2626"/></marker>
    <marker id="pcArrowPurple" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0.3 L6.6,3.5 L0,6.7 L1.7,3.5 Z" fill="#7c3aed"/></marker>
    <marker id="pcArrowGreen" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0.3 L6.6,3.5 L0,6.7 L1.7,3.5 Z" fill="#16a34a"/></marker>
    <style>
      #pcAnim .pc-s1 { animation: pcFade1 7s ease-in-out infinite; }
      #pcAnim .pc-s2 { animation: pcFade2 7s ease-in-out infinite; }
      #pcAnim .pc-s3 { animation: pcFade3 7s ease-in-out infinite; }
      @keyframes pcFade1 { 0%,4%{opacity:0} 10%,86%{opacity:1} 94%,100%{opacity:0} }
      @keyframes pcFade2 { 0%,34%{opacity:0} 40%,86%{opacity:1} 94%,100%{opacity:0} }
      @keyframes pcFade3 { 0%,64%{opacity:0} 70%,86%{opacity:1} 94%,100%{opacity:0} }
    </style>
  </defs>
  <g id="pcAnim">
    <circle cx="60" cy="50" r="26" fill="url(#pcQ1)"/>
    <text x="60" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">Q&#8321;+</text>

    <circle cx="320" cy="140" r="34" fill="url(#pcQ2)"/>
    <text x="320" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#fff1f2">Q&#8322;+</text>

    <circle cx="180" cy="170" r="15" fill="url(#pcq)"/>
    <text x="180" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">q+</text>

    <g class="pc-s1">
      <line x1="180" y1="170" x2="244" y2="234" stroke="#dc2626" stroke-width="3" marker-end="url(#pcArrowRed)"/>
      <text x="250" y="248" font-size="14" fill="#dc2626">F&#8321;</text>
      <line x1="180" y1="170" x2="92" y2="189" stroke="#7c3aed" stroke-width="3" marker-end="url(#pcArrowPurple)"/>
      <text x="58" y="200" font-size="14" fill="#7c3aed">F&#8322;</text>
    </g>

    <g class="pc-s2">
      <line x1="244" y1="234" x2="156" y2="253" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
      <line x1="92" y1="189" x2="156" y2="253" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
    </g>

    <g class="pc-s3">
      <line x1="180" y1="170" x2="156" y2="253" stroke="#16a34a" stroke-width="3.5" marker-end="url(#pcArrowGreen)"/>
      <text x="118" y="266" font-size="15" font-weight="600" fill="#16a34a">F&#8348;&#8340;&#8348;</text>
    </g>
  </g>
</svg>
<figcaption><span class="fig-num" data-fig-id="somma-forze-elettriche">Figura</span> — Animazione in loop: prima compaiono le singole forze repulsive $\vec F_1$ e $\vec F_2$ (dirette lontano da $Q_1$ e da $Q_2$), poi le linee tratteggiate che completano il parallelogramma, infine la forza totale $\vec F_{tot}$.</figcaption>
</div>
